meta:
  title: 老子
  wenda:
    - q:
        hant: 為什麼叫私校本
        hans: 为什么叫私校本
      a:
        hant: |
          叫私校本，因為這是未刊的私人校本。擇善而從，寫清今從之由，不充定本。
          文獻太多，各家各有立場。這裏只留作者此刻覺得更靠譜的本文。以後看法變了，改源即可；成品只呈現當前判斷。
          讀者首先是自己。若也能給別人用，更好。
        hans: |
          叫私校本，因为这是未刊的私人校本。择善而从，写清今从之由，不充定本。
          文献太多，各家各有立场。这里只留作者此刻觉得更靠谱的本文。以后看法变了，改源即可；成品只呈现当前判断。
          读者首先是自己。若也能给别人用，更好。

witnesses:
  - 王弼
  - 帛甲
  - 帛乙
  - 北大
  - 郭店

chapters:
  - id: de-01
    seq: 1
    pian: 德经
    title: 上德不德
    maps:
      received:
        - { from: 38, to: 38 }
      mawangdui:
        - { from: 1, to: 1 }
      beida:
        - { from: 1, to: 1 }
      guodian: []
    baiwen:
      hant: |
        上德不德，是以有德；下德不失德，是以無德。
        上德無為而無以為〔1〕；上仁為之而無以為；上義為之而有以為；上禮為之而莫之應，則攘臂而扔之〔2〕。
        故失道而後德，失德而後仁，失仁而後義，失義而後禮。
        夫禮者，忠信之薄，而亂之首。
        前識者，道之華，而愚之始。
        是以大丈夫處其厚，不居其薄；處其實，不居其華。故去彼取此。
      hans: |
        上德不德，是以有德；下德不失德，是以无德。
        上德无为而无以为〔1〕；上仁为之而无以为；上义为之而有以为；上礼为之而莫之应，则攘臂而扔之〔2〕。
        故失道而后德，失德而后仁，失仁而后义，失义而后礼。
        夫礼者，忠信之薄，而乱之首。
        前识者，道之华，而愚之始。
        是以大丈夫处其厚，不居其薄；处其实，不居其华。故去彼取此。
    jiaokan:
      - n: null
        lemma: ""
        readings: {}
        choice: null
        reason:
          hant: |
            此章通行本為第三十八章，帛書、北大漢簡德經之首。郭店無此章。今本次第從帛書，德經在前。
          hans: |
            此章通行本为第三十八章，帛书、北大汉简德经之首。郭店无此章。今本次第从帛书，德经在前。
      - n: 1
        lemma:
          hant: 上德無為而無以為
          hans: 上德无为而无以为
        readings:
          王弼:
            hant: 上德無為而無以為；下德為之而有以為
            hans: 上德无为而无以为；下德为之而有以为
          帛甲:
            hant: 上德無為而無以為也
            hans: 上德无为而无以为也
          帛乙:
            hant: 上德無為而無以為也
            hans: 上德无为而无以为也
          北大:
            hant: 上德無為而無以為也
            hans: 上德无为而无以为也
        choice: 帛甲
        reason:
          hant: |
            王弼本「上德」句下有「下德為之而有以為」。帛甲、帛乙、北大皆無此句，上德之後直接上仁。
            「下德不失德，是以無德」既已說下德，下文再造一句「下德為之」與上德、上仁、上義、上禮並列，層次重複。
            今從帛書，刪王弼本此句。句末語氣詞「也」不取，從通行本句法。
          hans: |
            王弼本「上德」句下有「下德为之而有以为」。帛甲、帛乙、北大皆无此句，上德之后直接上仁。
            「下德不失德，是以无德」既已说下德，下文再造一句「下德为之」与上德、上仁、上义、上礼并列，层次重复。
            今从帛书，删王弼本此句。句末语气词「也」不取，从通行本句法。
      - n: 2
        lemma: 扔之
        readings:
          王弼: 扔之
          帛甲: 乃之
          帛乙: 乃之
        choice: 王弼
        reason:
          hant: |
            帛書作「乃之」，與「扔」音近。扔、仍、乃，皆有就而拉拽義。王弼「攘臂而扔之」文義明白，今仍從王弼。
          hans: |
            帛书作「乃之」，与「扔」音近。扔、仍、乃，皆有就而拉拽义。王弼「攘臂而扔之」文义明白，今仍从王弼。
    yiwen:
      hant: |
        最高的德，不自居為德，所以才有德。次一等的德，緊緊抓住德的名相，所以反而沒有德。
        上德無所造作，也不存心去「表現」無為。上仁有所作為，卻不是為了自己。上義有所作為，而且存心要做成義。上禮有所作為，別人卻不回應，便捋起袖子去硬拉。
        所以，失去了道，而後才有德；失去了德，而後才有仁；失去了仁，而後才有義；失去了義，而後才有禮。
        禮，是忠信已經稀薄之後的東西，也是禍亂的開端。
        預先拿一套見識去框世界，是道的浮華，也是愚昧的開始。
        因此大丈夫立身在厚實處，不停留在淺薄處；立身在樸實處，不停留在浮華處。捨掉那個，要這個。
      hans: |
        最高的德，不自居为德，所以才有德。次一等的德，紧紧抓住德的名相，所以反而没有德。
        上德无所造作，也不存心去「表现」无为。上仁有所作为，却不是为了自己。上义有所作为，而且存心要做成义。上礼有所作为，别人却不回应，便捋起袖子去硬拉。
        所以，失去了道，而后才有德；失去了德，而后才有仁；失去了仁，而后才有义；失去了义，而后才有礼。
        礼，是忠信已经稀薄之后的东西，也是祸乱的开端。
        预先拿一套见识去框世界，是道的浮华，也是愚昧的开始。
        因此大丈夫立身在厚实处，不停留在浅薄处；立身在朴实处，不停留在浮华处。舍掉那个，要这个。
    anyu:
      hant: |
        此章把道、德、仁、義、禮排成一條下墜的梯子，不是在勸人「反禮」，而是指出：規範越明確，往往離那個不必規範的狀態越遠。上德「不德」，不是沒有德，是還不需要把德舉起來說。

        刪去「下德為之而有以為」，是因為這一句把「下德」塞進上德、上仁、上義、上禮的序列，和開頭「下德不失德，是以無德」搶位置。帛書三本一致，今從之。這是目前的判斷，不是定讞。
      hans: |
        此章把道、德、仁、义、礼排成一条下坠的梯子，不是在劝人「反礼」，而是指出：规范越明确，往往离那个不必规范的状态越远。上德「不德」，不是没有德，是还不需要把德举起来说。

        删去「下德为之而有以为」，是因为这一句把「下德」塞进上德、上仁、上义、上礼的序列，和开头「下德不失德，是以无德」抢位置。帛书三本一致，今从之。这是目前的判断，不是定谳。
